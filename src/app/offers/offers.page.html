<app-header [title]="'offers.title' | translate"></app-header>

<ion-content [fullscreen]="true">
  <div class="container">
    <div class="products-grid">
      @for (offer of offers; track offer.id) {
        <div class="product-card">
          <div class="product-image">
            <img [src]="offer.image" [alt]="offer.product">
          </div>
          
          <div class="product-info">
            <h3 class="product-title">{{ offer.product }}</h3>
            
            <div class="price-section">
              <span class="current-price">{{ offer.price | clp }}</span>
              @if (offer.originalPrice > offer.price) {
                <span class="original-price">{{ offer.originalPrice | clp }}</span>
                <span class="discount-badge">-{{ offer.discount }}%</span>
              }
            </div>
            
            <div class="product-details">
              <span class="category">{{ offer.category }}</span>
              <span class="valid-until">{{ 'offers.validUntil' | translate:{ date: (offer.validUntil | date:'d MMM') } }}</span>
            </div>

            <button type="button" class="add-button" (click)="addToCart(offer)">
              <ion-icon name="cart-outline" aria-hidden="true"></ion-icon>
              {{ 'offers.addToCart' | translate }}
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</ion-content>
