<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 500" width="100%" height="100%">
  <rect width="750" height="125" fill="#AA151B"/>
  <rect y="125" width="750" height="250" fill="#F1BF00"/>
  <rect y="375" width="750" height="125" fill="#AA151B"/>
  <!-- Escudo de España simplificado y nítido para icono -->
  <g transform="translate(195, 175)">
    <!-- Corona -->
    <path d="M10,25 C10,12 35,5 50,5 C65,5 90,12 90,25 Z" fill="#AA151B"/>
    <path d="M10,25 L90,25 L85,15 L50,18 L15,15 Z" fill="#D4AF37"/>
    <circle cx="50" cy="5" r="4" fill="#D4AF37"/>
    <circle cx="22" cy="10" r="3" fill="#D4AF37"/>
    <circle cx="78" cy="10" r="3" fill="#D4AF37"/>
    <!-- Columnas de Hércules -->
    <rect x="-16" y="32" width="10" height="88" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="-20" y="26" width="18" height="6" rx="2" fill="#D4AF37"/>
    <rect x="-22" y="120" width="22" height="6" rx="2" fill="#94A3B8"/>
    <!-- Cinta Plus -->
    <path d="M-22,65 Q-5,60 -5,72 Q-5,84 -22,78 Z" fill="#AA151B"/>
    
    <rect x="106" y="32" width="10" height="88" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="102" y="26" width="18" height="6" rx="2" fill="#D4AF37"/>
    <rect x="100" y="120" width="22" height="6" rx="2" fill="#94A3B8"/>
    <!-- Cinta Ultra -->
    <path d="M105,65 Q122,60 122,72 Q122,84 105,78 Z" fill="#AA151B"/>

    <!-- Escudo central -->
    <path d="M12,28 L88,28 L88,85 C88,118 50,132 50,132 C50,132 12,118 12,85 Z" fill="#AA151B" stroke="#D4AF37" stroke-width="3"/>
    <!-- Cuadrantes -->
    <!-- Castilla (Castillo oro en gules) -->
    <rect x="15" y="31" width="33" height="38" fill="#AA151B"/>
    <path d="M22,60 L22,48 L27,48 L27,44 L31,44 L31,48 L35,48 L35,44 L39,44 L39,48 L44,48 L44,60 Z" fill="#F1BF00"/>
    <!-- León (León púrpura en plata) -->
    <rect x="52" y="31" width="33" height="38" fill="#F8FAFC"/>
    <path d="M64,62 C64,52 69,45 74,48 C72,55 76,57 73,62 Z" fill="#7E22CE"/>
    <!-- Aragón (Barras de gules en oro) -->
    <rect x="15" y="71" width="33" height="38" fill="#F1BF00"/>
    <rect x="20" y="71" width="4" height="30" fill="#AA151B"/>
    <rect x="28" y="71" width="4" height="33" fill="#AA151B"/>
    <rect x="36" y="71" width="4" height="34" fill="#AA151B"/>
    <rect x="44" y="71" width="4" height="30" fill="#AA151B"/>
    <!-- Navarra (Cadenas oro en gules) -->
    <rect x="52" y="71" width="33" height="38" fill="#AA151B"/>
    <circle cx="68" cy="88" r="8" fill="none" stroke="#F1BF00" stroke-width="2.5"/>
    <path d="M57,77 L79,99 M79,77 L57,99" stroke="#F1BF00" stroke-width="2"/>
    <!-- Granada en punta -->
    <path d="M45,115 C45,108 55,108 55,115 C55,122 50,126 50,126 C50,126 45,122 45,115 Z" fill="#15803D"/>
    <!-- Escusón Borbón en el centro -->
    <ellipse cx="50" cy="70" rx="9" ry="12" fill="#1D4ED8" stroke="#AA151B" stroke-width="1.5"/>
    <circle cx="50" cy="67" r="2" fill="#F1BF00"/>
    <circle cx="47" cy="73" r="1.8" fill="#F1BF00"/>
    <circle cx="53" cy="73" r="1.8" fill="#F1BF00"/>
  </g>
